<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Globalny Licznik Czasu</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
    }
    .title {
      font-size: 1.5rem;
      margin-bottom: 12px;
      color: #a0a0a0;
      text-align: center;
    }
    .timer {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 2px;
      font-family: monospace;
    }
  </style>
</head>
<body>

 <h1 class="title">Czas od ostatniego pierdolnięcia głupoty przez Angelike:</h1>
  <div class="timer" id="timer">00 r : 00 m : 00 d : 00 g : 00 min : 00 s</div>

  <script>
    // TUTAJ USTAWIA SZ GLOBALNĄ DATĘ RESETU (Format: YYYY-MM-DDTHH:mm:ss)
    const START_DATE = "2026-09-06T22:40:00";

    const startTime = new Date(START_DATE).getTime();

    function updateTimer() {
      const now = Date.now();
      const diffInSeconds = Math.max(0, Math.floor((now - startTime) / 1000));

      const years = Math.floor(diffInSeconds / (365.25 * 24 * 3600));
      let rem = diffInSeconds % Math.floor(365.25 * 24 * 3600);

      const months = Math.floor(rem / (30.44 * 24 * 3600));
      rem %= Math.floor(30.44 * 24 * 3600);

      const days = Math.floor(rem / (24 * 3600));
      rem %= (24 * 3600);

      const hours = Math.floor(rem / 3600);
      rem %= 3600;

      const minutes = Math.floor(rem / 60);
      const seconds = rem % 60;

      const pad = (n) => String(n).padStart(2, '0');

      document.getElementById('timer').innerText = 
        `${pad(years)} r : ${pad(months)} m : ${pad(days)} d : ${pad(hours)} g : ${pad(minutes)} min : ${pad(seconds)} s`;
    }

    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
