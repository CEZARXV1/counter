<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Licznik czasu</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
    }
    .timer {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 20px;
      font-mono: monospace;
    }
    button {
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      color: #ffffff;
      background-color: #ff3b30;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #d72c21;
    }
  </style>
</head>
<body>
<h1 class="title">Czas od ostatniego pierdolnięcia głupoty przez Angelike:</h1>
  <div class="timer" id="timer">00 r : 00 m : 00 d : 00 g : 00 min : 00 s</div>
  <button onclick="resetTimer()">Reset</button>

  <script>
    const STORAGE_KEY = 'timer_start_time';

    // Pobierz zapisany czas lub ustaw obecny
    function getStartTime() {
      let startTime = localStorage.getItem(STORAGE_KEY);
      if (!startTime) {
        startTime = Date.now();
        localStorage.setItem(STORAGE_KEY, startTime);
      }
      return parseInt(startTime, 10);
    }

    function updateTimer() {
      const startTime = getStartTime();
      const now = Date.now();
      const diffInSeconds = Math.floor((now - startTime) / 1000);

      // Obliczenia czasu (przyjęto średnią 30.44 dni / miesiąc oraz 365.25 dni / rok)
      const years = Math.floor(diffInSeconds / (365.25 * 24 * 3600));
      let rem = diffInSeconds % Math.floor(365.25 * 24 * 3600);

      const months = Math.floor(rem / (30.44 * 24 * 3600));
      rem %= Math.floor(30.44 * 24 * 3600);

      const days = Math.floor(rem / (24 * 3600));
      rem %= (24 * 3600);

      const hours = Math.floor(rem / 3600);
      rem %= 3600;

      const minutes = Math.floor(rem / 60);
      const seconds = rem % 60;

      // Formatowanie dwucyfrowe
      const pad = (n) => String(n).padStart(2, '0');

      document.getElementById('timer').innerText = 
        `${pad(years)} r : ${pad(months)} m : ${pad(days)} d : ${pad(hours)} g : ${pad(minutes)} min : ${pad(seconds)} s`;
    }

    function resetTimer() {
      localStorage.setItem(STORAGE_KEY, Date.now());
      updateTimer();
    }

    // Zapis stanu w localStorage gwarantuje, że licznik nie zeruje się po odświeżeniu strony
    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
